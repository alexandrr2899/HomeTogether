worker_processes 1;
pid /tmp/openclaw-relay.pid;
error_log /dev/stderr crit;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/openclaw-relay-client-body;
    proxy_temp_path /tmp/openclaw-relay-proxy;
    fastcgi_temp_path /tmp/openclaw-relay-fastcgi;
    uwsgi_temp_path /tmp/openclaw-relay-uwsgi;
    scgi_temp_path /tmp/openclaw-relay-scgi;

    server {
        listen 172.17.0.1:18890;
        client_max_body_size 64k;

        location = /v1/models {
            allow 172.30.90.2;
            deny all;
            proxy_pass http://127.0.0.1:18789;
            proxy_set_header Host 127.0.0.1:18789;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location = /v1/chat/completions {
            allow 172.30.90.2;
            deny all;
            proxy_pass http://127.0.0.1:18789;
            proxy_set_header Host 127.0.0.1:18789;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 3s;
            proxy_read_timeout 90s;
        }

        location / { return 404; }
    }
}
